# Runtime configuration — commit safe (no secrets)
site:
  origin: "https://www.folloze-blog.com"
  insights_path: "/insights"
  ga4_measurement_id: "G-JDDWKS0VX6"

delivery:
  target: "vercel_static"
  release_mode: "auto"
  preview_url: "https://folloze-blog.vercel.app"
  production_url: "https://www.folloze-blog.com"

pipeline:
  quality_threshold: 70
  max_retries_llm: 2
  max_quality_repairs: 3
  verify_timeout_seconds: 300
  timezone: "America/Chicago"
  run_hour: 7
  log_level: "INFO"
  max_log_age_days: 30
  geo_quality_threshold: 0
  pre_publish_llm_test: true

notifications:
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    from_address: "juno@elevationengine.co"
    # Default email recipients for Folloze Insights pipeline mail.
    # This covers error/failure notifications and any other non-weekly-GEO email sends.
    to_addresses:
      - "trey.harnden@folloze.com"
    # Weekly GEO summary recipients only.
    # Keep Kristi here, not in to_addresses, so she does not receive Insights error mail.
    weekly_geo_to_addresses:
      - "trey.harnden@folloze.com"
      - "kristi.tutt@folloze.com"
  discord:
    enabled: true
    channel_target: "channel:example"

content:
  default_audience: "B2B revenue teams"
  min_words_by_type:
    comparison: 900
    guide: 1000
    faq: 700
    glossary: 500
    blog: 500

llm:
  provider: "gemini"
  generation_model: "gemini-2.5-flash"
  research_model: "gemini-2.5-flash"
