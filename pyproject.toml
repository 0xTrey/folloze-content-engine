[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folloze-content-engine"
version = "1.0.0"
description = "AEO content pipeline and static site builder for Folloze Insights."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3,<5",
    "jinja2>=3.1.4,<4",
    "jsonschema>=4.23.0,<5",
    "python-dateutil>=2.9.0,<3",
    "pyyaml>=6.0.2,<7",
    "requests>=2.32.3,<3",
    "ruff>=0.4.10,<1",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5.0,<2",
    "pytest>=8.3.2,<9",
    "pytest-mock>=3.14.0,<4",
    "responses>=0.25.3,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.setuptools]
py-modules = [
    "authors",
    "artifacts",
    "brand_rules",
    "config",
    "content_calendar",
    "exceptions",
    "generator",
    "notify",
    "optimizer",
    "pipeline",
    "quality",
    "research",
    "runtime_secrets",
    "verify",
]
