<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ artifact.meta_title }}</title>
    <meta name="description" content="{{ artifact.meta_description }}">
    <link rel="canonical" href="{{ artifact.canonical_url }}">
    <link rel="stylesheet" href="/styles.css">
    <script type="application/ld+json">{{ artifact.json_ld | safe }}</script>
  </head>
  <body class="article-page">
    <header class="site-header">
      <div class="shell site-header__inner">
        <a class="brand" href="/">
          <span class="brand__mark">Folloze</span>
          <span class="brand__sub">Insights</span>
        </a>
        <nav class="site-nav">
          <a href="/">Blog</a>
          <a href="https://www.folloze.com" rel="noreferrer">Folloze</a>
        </nav>
      </div>
    </header>
    <main class="shell shell--article">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <p>V1 test blog for Folloze on Vercel.</p>
      </div>
    </footer>
  </body>
</html>
