name: Folloze Blog Cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folloze-blog-cloudflare-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare exact production snapshot
        run: bash scripts/prepare-cloudflare-blog.sh

      - name: Verify snapshot manifest
        run: |
          cd site/cloudflare-production
          shasum -a 256 -c ../../deploy/cloudflare/manifest.sha256

      - name: Deploy production Worker
        if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4.121.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production Worker
        if: github.event_name != 'pull_request'
        run: bash scripts/verify-cloudflare-blog.sh
